name: Branch Flow

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Package manager audit
        run: |
          node scripts/test-package-manager-audit.mjs
          node scripts/audit-package-manager.mjs

      - name: GitHub Actions policy audit
        run: |
          node scripts/test-github-actions-audit.mjs
          node scripts/audit-github-actions.mjs

      - name: Branch flow audit self-test
        run: bash scripts/test-branch-flow-audit.sh

      - name: Branch flow audit
        run: bash scripts/audit-branch-flow.sh

      - name: Validate PR target
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "PR branch flow: ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          if [[ "$BASE_BRANCH" != "master" ]]; then
            echo "::error::All pull requests must target master."
            exit 1
          fi

          if [[ "$HEAD_BRANCH" == "master" ]]; then
            echo "::error::Use a short-lived working branch for changes to master."
            exit 1
          fi
