name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: |
          npm install -g corepack@0.34.1
          corepack enable

      - name: Branch flow audit
        run: |
          bash ./scripts/test-branch-flow-audit.sh
          bash ./scripts/audit-branch-flow.sh

      - name: Audit public artifacts
        run: |
          bash ./scripts/test-public-artifacts-audit.sh
          ./scripts/audit-public-artifacts.sh

      - name: TODO debt audit
        run: |
          bash ./scripts/test-todo-debt-audit.sh
          bash ./scripts/audit-todo-debt.sh

      - name: Iroha production send readiness gate
        run: |
          bash ./scripts/test-iroha-js-candidate-verifier.sh
          bash ./scripts/verify-iroha-js-candidate.sh
          bash ./scripts/test-iroha-production-send-readiness-audit.sh
          bash ./scripts/audit-iroha-production-send-readiness.sh

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate vendored and installed Iroha browser SDK artifact
        run: |
          yarn test:vendored-iroha-sdk-audit
          yarn audit:vendored-iroha-sdk

      - name: Production dependency audit
        run: |
          yarn audit:dependencies
          yarn audit:dependencies:production

      - name: Fail-closed crypto dependency shims
        run: yarn test:crypto-dependency-shims

      - name: Iroha native Safari QA contract self-test
        run: yarn test:iroha-safari-qa

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:check

      - name: Unit tests
        run: yarn test:unit

      - name: Build web app
        run: yarn build:web

      - name: Deterministic extension package self-test
        run: |
          yarn test:extension-package
          yarn test:extension-build-environment
          yarn test:import-chrome-release-config
          yarn test:prepare-chrome-release
          yarn test:release-source-audit

      - name: Build Chrome extension
        run: yarn build:extension:zip

      - name: Chrome release package audit self-test
        run: yarn test:chrome-release-audit

      - name: Chrome production popup smoke
        run: yarn test:smoke:chrome:production

      - name: Solana extension e2e smoke
        run: yarn test:e2e:solana

      - name: Bitcoin broadcast smoke and evidence gate
        run: |
          yarn test:smoke:bitcoin
          yarn test:bitcoin-broadcast-evidence-template
          yarn generate:bitcoin-broadcast-evidence-template -- --output build/reports/bitcoin-broadcast-evidence-template.json
          yarn test:bitcoin-broadcast-evidence-audit
          yarn audit:bitcoin-broadcast-evidence

      - name: Build Firefox extension
        run: yarn build:extension:firefox

      - name: Lint Firefox extension package
        run: yarn lint:webext:firefox

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: 152.0.4

      - name: Firefox extension runtime and CSP smoke
        run: yarn test:smoke:firefox
        env:
          FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
