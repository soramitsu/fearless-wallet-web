compressionLevel: mixed

enableGlobalCache: true

# Install scripts run with the user's full access on the release machine, where the store upload key and the
# browser sessions live; that is how the 2025 npm worms spread. No dependency needs one: esbuild, @swc/core,
# @parcel/watcher and unrs-resolver find their prebuilt binary packages without theirs, and core-js-pure's prints a
# banner. Allow one only through package.json dependenciesMeta, after reviewing it.
enableScripts: false

nodeLinker: node-modules

# A version published in the last 7 days is not resolved: compromised npm releases are usually withdrawn within hours
# or days. For an urgent fix, list that one package in npmPreapprovedPackages.
npmMinimalAgeGate: 7d
